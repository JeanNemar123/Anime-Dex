name: Build APK
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "HTTPS address of your AnimeDex server (optional)"
        required: false
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SERVER_URL: ${{ inputs.server_url || vars.SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          unzip -q animedex-app.zip -d /tmp/x
          rm -rf /tmp/x/animedex-app/.github
          cp -r /tmp/x/animedex-app/. .
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Set server address
        run: node -e 'require("fs").writeFileSync("public/config.js","window.ANIMEDEX_SERVER="+JSON.stringify(process.env.SERVER_URL||"")+";\n")'
      - run: npm install
      - run: '[ -d android ] || npx cap add android'
      - name: App icon
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#6c4cf1' --splashBackgroundColor '#14121f'
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: animedex-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
