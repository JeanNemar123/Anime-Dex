name: Build APK
on:
  workflow_dispatch: {}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          Z=$(ls -t ./*.zip 2>/dev/null | head -n1 || true)
          if [ -n "$Z" ]; then
            echo "Zip trouvé : $Z"
            unzip -q "$Z" -d /tmp/x
            D=$(find /tmp/x -maxdepth 1 -mindepth 1 -type d | head -n1)
            rm -rf "$D/.github"
            cp -r "$D"/. .
          fi
          ls -A
          test -f package.json && test -d public && test -d android-res
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: '[ -d android ] || npx cap add android'
      - name: App icon
        run: cp -r android-res/. android/app/src/main/res/
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: animedex-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
